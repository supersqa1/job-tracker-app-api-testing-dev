name: Simple Pipeline With API Tests

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Build simulation
        run: echo "Building the application..."

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to dev simulation
        run: echo "Deploying the application to the dev environment..."

  api-tests:
    name: Run API Tests on Dev
    runs-on: ubuntu-latest
    needs: deploy-dev

    env:
      BASE_URL: http://localhost:3050
      DATABASE_PATH: ${{ github.workspace }}/app-under-test/backend/data/job_tracker.db

    steps:
      - name: Checkout test framework
        uses: actions/checkout@v5

      - name: Checkout app under test
        uses: actions/checkout@v5
        with:
          repository: supersqa1/job-tracker-app-for-testing
          path: app-under-test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test framework dependencies
        run: pip install -r requirements.txt

      - name: Install app dependencies
        working-directory: app-under-test/backend
        run: pip install -r requirements.txt

      - name: Start API app
        working-directory: app-under-test/backend
        run: |
          PYTHONPATH=. python -m uvicorn app.main:app --host 0.0.0.0 --port 3050 &

      - name: Wait for API app
        run: |
          for i in {1..30}; do
            curl -f http://localhost:3050/api/v1/public/status && exit 0
            sleep 2
          done
          echo "API app did not start in time"
          exit 1

      - name: Run API tests with HTML report
        run: pytest tests --html=reports/api-test-report.html --self-contained-html

      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        with:
          name: simple-pipeline-api-test-report
          path: reports/

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
      - name: Deploy to prod simulation
        run: echo "Deploying the tested application to production..."
