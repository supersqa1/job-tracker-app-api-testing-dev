name: Demo 02 - Basic Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application simulation
        run: echo "Building the application package..."

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to development simulation
        run: echo "Deploying the latest build to the development environment..."

  test-dev:
    name: Test on Dev
    runs-on: ubuntu-latest
    needs: deploy-dev

    steps:
      - name: Run API tests against dev simulation
        run: echo "Running API tests against the development environment..."

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: test-dev

    steps:
      - name: Deploy to production simulation
        run: echo "Deploying the tested build to production..."
